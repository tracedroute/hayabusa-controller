---
# HAYABUSA_SECOPS_PLAYBOOK_V1 — OWASP ZAP
- name: "SECops — OWASP ZAP baseline"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    secops_execute: "{{ secops_execute | default(false) }}"
    secops_target: "{{ secops_target | default('', true) }}"
    secops_zap_bin: "{{ secops_zap_bin | default('/opt/zap/zap.sh', true) }}"
    secops_timeout_sec: "{{ secops_timeout_sec | default(600) | int }}"
  tasks:
    - name: Safety brief
      ansible.builtin.debug:
        msg:
          tool: zap
          target: "{{ secops_target | default('(unset)', true) }}"
          execute: "{{ secops_execute }}"

    - name: Locate ZAP
      ansible.builtin.stat:
        path: "{{ secops_zap_bin }}"
      register: zap_stat

    - name: Report availability
      ansible.builtin.debug:
        msg: "zap={{ secops_zap_bin if zap_stat.stat.exists else '(not found)' }}"

    - name: Require target and confirm
      ansible.builtin.assert:
        that:
          - secops_execute | bool
          - secops_target | length > 0
          - zap_stat.stat.exists
        fail_msg: "Need ZAP at secops_zap_bin, -e secops_target=https://…, -e secops_execute=true."
      when: secops_execute | bool

    - name: Run ZAP baseline (dockerless script)
      ansible.builtin.command:
        argv:
          - "{{ secops_zap_bin }}"
          - -cmd
          - -quickurl
          - "{{ secops_target }}"
          - -quickprogress
      register: tool_out
      changed_when: false
      when: secops_execute | bool
      async: "{{ secops_timeout_sec }}"
      poll: 10

    - name: Show output
      ansible.builtin.debug:
        var: tool_out.stdout_lines
      when: secops_execute | bool and tool_out is defined
