---
# HAYABUSA_SECOPS_PLAYBOOK_V1 — Nuclei
- name: "SECops — Nuclei template scan"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    secops_execute: "{{ secops_execute | default(false) }}"
    secops_target: "{{ secops_target | default('', true) }}"
    secops_timeout_sec: "{{ secops_timeout_sec | default(300) | int }}"
  tasks:
    - name: Safety brief
      ansible.builtin.debug:
        msg:
          tool: nuclei
          target: "{{ secops_target | default('(unset)', true) }}"
          execute: "{{ secops_execute }}"

    - name: Locate nuclei
      ansible.builtin.command: bash -lc "command -v nuclei || true"
      register: which_tool
      changed_when: false
      failed_when: false

    - name: Report availability
      ansible.builtin.debug:
        msg: "nuclei={{ which_tool.stdout | trim | default('(not found)') }}"

    - name: Require target and confirm
      ansible.builtin.assert:
        that:
          - secops_execute | bool
          - secops_target | length > 0
          - (which_tool.stdout | trim | length) > 0
        fail_msg: "Need nuclei, -e secops_target=https://…, and -e secops_execute=true."
      when: secops_execute | bool

    - name: Run Nuclei
      ansible.builtin.command:
        argv: [nuclei, -u, "{{ secops_target }}", -silent, -nc]
      register: tool_out
      changed_when: false
      when: secops_execute | bool
      async: "{{ secops_timeout_sec }}"
      poll: 5

    - name: Show findings
      ansible.builtin.debug:
        var: tool_out.stdout_lines
      when: secops_execute | bool and tool_out is defined
