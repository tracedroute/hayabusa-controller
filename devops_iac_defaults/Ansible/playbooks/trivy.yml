---
# HAYABUSA_SECOPS_PLAYBOOK_V1 — Trivy
- name: "SECops — Trivy scan"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    secops_execute: "{{ secops_execute | default(false) }}"
    secops_trivy_mode: "{{ secops_trivy_mode | default('fs', true) }}"
    secops_target: "{{ secops_target | default('.', true) }}"
    secops_timeout_sec: "{{ secops_timeout_sec | default(300) | int }}"
  tasks:
    - name: Safety brief
      ansible.builtin.debug:
        msg:
          tool: trivy
          mode: "{{ secops_trivy_mode }}"
          target: "{{ secops_target }}"
          execute: "{{ secops_execute }}"

    - name: Locate trivy
      ansible.builtin.command: bash -lc "command -v trivy || true"
      register: which_tool
      changed_when: false
      failed_when: false

    - name: Report availability
      ansible.builtin.debug:
        msg: "trivy={{ which_tool.stdout | trim | default('(not found)') }}"

    - name: Require confirm
      ansible.builtin.assert:
        that:
          - secops_execute | bool
          - (which_tool.stdout | trim | length) > 0
        fail_msg: "Need trivy and -e secops_execute=true."
      when: secops_execute | bool

    - name: Run Trivy
      ansible.builtin.command:
        argv: [trivy, "{{ secops_trivy_mode }}", "{{ secops_target }}"]
      register: tool_out
      changed_when: false
      when: secops_execute | bool
      async: "{{ secops_timeout_sec }}"
      poll: 5

    - name: Show findings
      ansible.builtin.debug:
        var: tool_out.stdout_lines
      when: secops_execute | bool and tool_out is defined
