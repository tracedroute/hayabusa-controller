---
# HAYABUSA_SECOPS_PLAYBOOK_V1 — Prowler
# Cloud credentials via controller vault / env (AWS_*, AZURE_*, GOOGLE_*).
- name: "SECops — Prowler cloud posture"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    secops_execute: "{{ secops_execute | default(false) }}"
    secops_provider: "{{ secops_provider | default('aws', true) }}"
    secops_timeout_sec: "{{ secops_timeout_sec | default(600) | int }}"
    # Example: AWS_ACCESS_KEY_ID from vault name aws_access_key_id on controller job env
  tasks:
    - name: Safety brief
      ansible.builtin.debug:
        msg:
          tool: prowler
          provider: "{{ secops_provider }}"
          execute: "{{ secops_execute }}"
          note: "Cloud keys must live on the controller (env or vault), not in this playbook."

    - name: Locate prowler
      ansible.builtin.command: bash -lc "command -v prowler || true"
      register: which_tool
      changed_when: false
      failed_when: false

    - name: Report availability
      ansible.builtin.debug:
        msg: "prowler={{ which_tool.stdout | trim | default('(not found)') }}"

    - name: Require confirm
      ansible.builtin.assert:
        that:
          - secops_execute | bool
          - (which_tool.stdout | trim | length) > 0
        fail_msg: "Need prowler and -e secops_execute=true."
      when: secops_execute | bool

    - name: Run Prowler provider help / quick check
      ansible.builtin.command:
        argv: [prowler, "{{ secops_provider }}", "-h"]
      register: tool_out
      changed_when: false
      failed_when: false
      when: secops_execute | bool

    - name: Show output
      ansible.builtin.debug:
        var: tool_out.stdout_lines
      when: secops_execute | bool and tool_out is defined
