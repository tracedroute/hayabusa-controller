---
# HAYABUSA_SECOPS_PLAYBOOK_V1 — RustScan
# Secrets stay on the controller. Do not embed live passwords in this file.
- name: "SECops — RustScan port discovery"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    secops_execute: "{{ secops_execute | default(false) }}"
    secops_target: "{{ secops_target | default('', true) }}"
    secops_timeout_sec: "{{ secops_timeout_sec | default(300) | int }}"
    secops_ulimit: "{{ secops_ulimit | default(5000) | int }}"
  tasks:
    - name: Safety brief
      ansible.builtin.debug:
        msg:
          tool: rustscan
          target: "{{ secops_target | default('(unset)', true) }}"
          execute: "{{ secops_execute }}"
          note: "Authorized lab/scope only. Prefight unless secops_execute=true."

    - name: Locate rustscan
      ansible.builtin.command: bash -lc "command -v rustscan || true"
      register: which_tool
      changed_when: false
      failed_when: false

    - name: Report availability
      ansible.builtin.debug:
        msg: "rustscan={{ which_tool.stdout | trim | default('(not found)') }}"

    - name: Require target and confirm
      ansible.builtin.assert:
        that:
          - secops_execute | bool
          - secops_target | length > 0
          - (which_tool.stdout | trim | length) > 0
        fail_msg: "Need rustscan installed, -e secops_target=…, and -e secops_execute=true."
      when: secops_execute | bool

    - name: Run RustScan
      ansible.builtin.command:
        argv:
          - rustscan
          - -a
          - "{{ secops_target }}"
          - --ulimit
          - "{{ secops_ulimit | string }}"
          - -g
      register: tool_out
      changed_when: false
      when: secops_execute | bool
      async: "{{ secops_timeout_sec }}"
      poll: 5

    - name: Show output
      ansible.builtin.debug:
        var: tool_out.stdout_lines
      when: secops_execute | bool and tool_out is defined
