---
# HAYABUSA_SECOPS_PLAYBOOK_V1 — BloodHound.py
# Domain password from controller vault via HAYABUSA_SECRET_ad_bind_password.
- name: "SECops — BloodHound.py collector"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    secops_execute: false
    secops_domain: ""
    secops_dc: ""
    secops_username: ""
    secops_password: "{{ lookup('env', 'HAYABUSA_SECRET_ad_bind_password') | default('', true) }}"
    secops_collection: "DCOnly"
    secops_cli_args: ""
    secops_timeout_sec: 600
  tasks:
    - name: Safety brief
      ansible.builtin.debug:
        msg:
          tool: bloodhound-python
          domain: "{{ secops_domain | default('(unset)', true) }}"
          dc: "{{ secops_dc | default('(unset)', true) }}"
          execute: "{{ secops_execute }}"
          creds: "password from controller vault key ad_bind_password when hydrated"

    - name: Locate bloodhound-python
      ansible.builtin.shell: command -v bloodhound-python || command -v bloodhound || true
      args:
        executable: /bin/bash
      register: which_tool
      changed_when: false
      failed_when: false

    - name: Report availability
      ansible.builtin.debug:
        msg: "bloodhound={{ which_tool.stdout | trim | default('(not found)') }}"

    - name: Require domain params and confirm
      ansible.builtin.assert:
        that:
          - secops_execute | bool
          - (which_tool.stdout | trim | length) > 0
          - ((secops_domain | length > 0) and (secops_dc | length > 0) and (secops_username | length > 0)) or (secops_cli_args | length > 0)
        fail_msg: "Need collector binary, -e secops_domain/dc/username or secops_cli_args, and -e secops_execute=true."
      when: secops_execute | bool

    - name: Ensure results directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../results"
        state: directory
        mode: "0755"
      when: secops_execute | bool

    - name: Run BloodHound.py (structured)
      ansible.builtin.command:
        argv:
          - "{{ which_tool.stdout | trim }}"
          - -d
          - "{{ secops_domain }}"
          - -u
          - "{{ secops_username }}"
          - -p
          - "{{ secops_password }}"
          - -ns
          - "{{ secops_dc }}"
          - -c
          - "{{ secops_collection }}"
      register: tool_out
      changed_when: false
      no_log: true
      when: secops_execute | bool and (secops_cli_args | length) == 0
      async: "{{ secops_timeout_sec }}"
      poll: 10

    - name: Run BloodHound.py (cli args)
      ansible.builtin.command:
        argv: "{{ [which_tool.stdout | trim] + (secops_cli_args.split() | list) }}"
      register: tool_out_cli
      changed_when: false
      no_log: true
      when: secops_execute | bool and (secops_cli_args | length) > 0
      async: "{{ secops_timeout_sec }}"
      poll: 10

    - name: Merge output
      ansible.builtin.set_fact:
        secops_stdout: >-
          {{ (tool_out.stdout | default('')) if (tool_out is defined and tool_out is not skipped) else '' }}{{
          (tool_out_cli.stdout | default('')) if (tool_out_cli is defined and tool_out_cli is not skipped) else '' }}{{
          (tool_out_r.stdout | default('')) if (tool_out_r is defined and tool_out_r is not skipped) else '' }}
        secops_stderr: >-
          {{ (tool_out.stderr | default('')) if (tool_out is defined and tool_out is not skipped) else '' }}{{
          (tool_out_cli.stderr | default('')) if (tool_out_cli is defined and tool_out_cli is not skipped) else '' }}{{
          (tool_out_r.stderr | default('')) if (tool_out_r is defined and tool_out_r is not skipped) else '' }}
      when: secops_execute | bool

    - name: Show collector result
      ansible.builtin.debug:
        msg: "{{ secops_stdout.splitlines() if secops_stdout is defined else [] }}"
      when: secops_execute | bool

    - name: Persist results for controller / workspace
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../results/bloodhound-{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}.txt"
        content: |
          # hayabusa-secops bloodhound
          domain={{ secops_domain }}
          dc={{ secops_dc }}
          --- stdout ---
          {{ secops_stdout | default('') }}
          --- stderr ---
          {{ secops_stderr | default('') }}
        mode: "0640"
      when: secops_execute | bool and secops_stdout is defined
