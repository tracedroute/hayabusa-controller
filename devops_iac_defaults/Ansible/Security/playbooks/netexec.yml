---
# HAYABUSA_SECOPS_PLAYBOOK_V1 — NetExec
# Password from controller vault via HAYABUSA_SECRET_lan_smb_password (optional).
- name: "SECops — NetExec (nxc)"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    secops_execute: false
    secops_target: ""
    secops_protocol: "smb"
    secops_username: ""
    secops_password: "{{ lookup('env', 'HAYABUSA_SECRET_lan_smb_password') | default('', true) }}"
    secops_cli_args: ""
    secops_timeout_sec: 300
  tasks:
    - name: Safety brief
      ansible.builtin.debug:
        msg:
          tool: nxc
          protocol: "{{ secops_protocol }}"
          target: "{{ secops_target | default('(unset)', true) }}"
          execute: "{{ secops_execute }}"
          creds: "password from controller vault key lan_smb_password when hydrated"

    - name: Locate nxc or netexec
      ansible.builtin.shell: command -v nxc || command -v netexec || true
      args:
        executable: /bin/bash
      register: which_tool
      changed_when: false
      failed_when: false

    - name: Report availability
      ansible.builtin.debug:
        msg: "netexec={{ which_tool.stdout | trim | default('(not found)') }}"

    - name: Require confirm
      ansible.builtin.assert:
        that:
          - secops_execute | bool
          - (which_tool.stdout | trim | length) > 0
          - (secops_target | length > 0) or (secops_cli_args | length > 0)
        fail_msg: "Need nxc/netexec, -e secops_target=… or secops_cli_args=…, and -e secops_execute=true."
      when: secops_execute | bool

    - name: Ensure results directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../results"
        state: directory
        mode: "0755"
      when: secops_execute | bool

    - name: Run NetExec (structured)
      ansible.builtin.command:
        argv: "{{ [which_tool.stdout | trim, secops_protocol, secops_target] + (['-u', secops_username, '-p', secops_password] if (secops_username | length > 0) else []) }}"
      register: tool_out
      changed_when: false
      no_log: true
      when: secops_execute | bool and (secops_cli_args | length) == 0
      async: "{{ secops_timeout_sec }}"
      poll: 5

    - name: Run NetExec (cli args)
      ansible.builtin.command:
        argv: "{{ [which_tool.stdout | trim] + (secops_cli_args.split() | list) }}"
      register: tool_out_cli
      changed_when: false
      no_log: true
      when: secops_execute | bool and (secops_cli_args | length) > 0
      async: "{{ secops_timeout_sec }}"
      poll: 5

    - name: Merge output
      ansible.builtin.set_fact:
        secops_stdout: >-
          {{ (tool_out.stdout | default('')) if (tool_out is defined and tool_out is not skipped) else '' }}{{
          (tool_out_cli.stdout | default('')) if (tool_out_cli is defined and tool_out_cli is not skipped) else '' }}{{
          (tool_out_r.stdout | default('')) if (tool_out_r is defined and tool_out_r is not skipped) else '' }}
        secops_stderr: >-
          {{ (tool_out.stderr | default('')) if (tool_out is defined and tool_out is not skipped) else '' }}{{
          (tool_out_cli.stderr | default('')) if (tool_out_cli is defined and tool_out_cli is not skipped) else '' }}{{
          (tool_out_r.stderr | default('')) if (tool_out_r is defined and tool_out_r is not skipped) else '' }}
      when: secops_execute | bool

    - name: Show output
      ansible.builtin.debug:
        msg: "{{ secops_stdout.splitlines() if secops_stdout is defined else [] }}"
      when: secops_execute | bool

    - name: Persist results for controller / workspace
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../results/netexec-{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}.txt"
        content: |
          # hayabusa-secops netexec
          target={{ secops_target }}
          protocol={{ secops_protocol }}
          --- stdout ---
          {{ secops_stdout | default('') }}
          --- stderr ---
          {{ secops_stderr | default('') }}
        mode: "0640"
      when: secops_execute | bool and secops_stdout is defined
