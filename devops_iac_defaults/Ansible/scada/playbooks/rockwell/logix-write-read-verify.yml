---
- name: Rockwell Logix — write tag and read back (cpppo lab / pycomm3 hardware)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Safety gate
      ansible.builtin.fail:
        msg: Set allow_ab_write=true for lab write verification.
      when: not (allow_ab_write | default(false) | bool)

    - name: Read tag before write
      ansible.builtin.command:
        cmd: >-
          python3 {{ playbook_dir }}/../scripts/logix_tags.py read
          --engine {{ ab_cip_engine | default('cpppo') }}
          --host {{ plc_host }}
          --path {{ ab_path | default(plc_host ~ '/0') }}
          --timeout {{ plc_timeout | float }}
          --tags {{ ab_verify_tag | default('MotorSpeed') }}
      register: ab_before
      changed_when: false

    - name: Write tag value
      ansible.builtin.command:
        cmd: >-
          python3 {{ playbook_dir }}/../scripts/logix_tags.py write
          --engine {{ ab_cip_engine | default('cpppo') }}
          --host {{ plc_host }}
          --path {{ ab_path | default(plc_host ~ '/0') }}
          --timeout {{ plc_timeout | float }}
          --tag {{ ab_verify_tag | default('MotorSpeed') }}
          --value {{ ab_verify_write_value | default(77) | to_json }}
      register: ab_write
      changed_when: true

    - name: Read tag after write
      ansible.builtin.command:
        cmd: >-
          python3 {{ playbook_dir }}/../scripts/logix_tags.py read
          --engine {{ ab_cip_engine | default('cpppo') }}
          --host {{ plc_host }}
          --path {{ ab_path | default(plc_host ~ '/0') }}
          --timeout {{ plc_timeout | float }}
          --tags {{ ab_verify_tag | default('MotorSpeed') }}
      register: ab_after
      changed_when: false

    - name: Parse verification results
      ansible.builtin.set_fact:
        ab_before_result: "{{ ab_before.stdout | from_json }}"
        ab_write_result: "{{ ab_write.stdout | from_json }}"
        ab_after_result: "{{ ab_after.stdout | from_json }}"

    - name: Assert write/read round-trip
      ansible.builtin.assert:
        that:
          - ab_write_result.success | bool
          - ab_after_result.success | bool
          - (ab_after_result.result['values'] | first).value == (ab_verify_write_value | default(77) | int)
        fail_msg: >-
          Logix write/read verify failed. before={{ ab_before_result }}
          write={{ ab_write_result }} after={{ ab_after_result }}

    - name: Show round-trip result
      ansible.builtin.debug:
        msg:
          tag: "{{ ab_verify_tag }}"
          before: "{{ (ab_before_result.result['values'] | first).value }}"
          written: "{{ ab_verify_write_value }}"
          after: "{{ (ab_after_result.result['values'] | first).value }}"
