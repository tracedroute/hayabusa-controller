---
- name: Mitsubishi — write word units (MC Protocol Type3E)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mitsubishi_write_values: [1, 0]
    plc_payload:
      protocol: mitsubishi_mc
      host: "{{ plc_host }}"
      port: "{{ mitsubishi_port | int }}"
      device: "{{ mitsubishi_device }}"
      values: "{{ mitsubishi_write_values }}"
      authorized: true
      timeout: "{{ plc_timeout | float }}"
  tasks:
    - name: Safety gate
      ansible.builtin.fail:
        msg: Set allow_mitsubishi_write=true and enable plc_writes_enabled in Hayabusa operator policy.
      when: not (allow_mitsubishi_write | default(false) | bool)

    - name: Batch-write word units
      ansible.builtin.command:
        cmd: python3 "{{ playbook_dir }}/../scripts/plc_cli.py" write --payload-env PLC_PAYLOAD
      environment:
        PLC_PAYLOAD: "{{ plc_payload | to_json }}"
      register: mc_write
      changed_when: true

    - name: Show write result
      ansible.builtin.debug:
        msg: "{{ mc_write.stdout | from_json }}"
