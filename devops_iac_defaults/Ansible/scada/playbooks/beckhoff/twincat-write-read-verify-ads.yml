---
- name: Beckhoff TwinCAT — ADS write/read verify (pyads lab testserver)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    beckhoff_verify_symbol: "{{ beckhoff_verify_symbol | default('test1') }}"
    beckhoff_verify_write_value: "{{ beckhoff_verify_write_value | default(88) }}"
    beckhoff_read_payload:
      protocol: beckhoff_ads
      host: "{{ plc_host }}"
      ams_net_id: "{{ beckhoff_ams_net_id }}"
      ads_port: "{{ beckhoff_ads_port | int }}"
      symbols: "{{ beckhoff_verify_symbol }}"
      timeout: "{{ plc_timeout | float }}"
    beckhoff_write_payload:
      protocol: beckhoff_ads
      host: "{{ plc_host }}"
      ams_net_id: "{{ beckhoff_ams_net_id }}"
      ads_port: "{{ beckhoff_ads_port | int }}"
      symbol: "{{ beckhoff_verify_symbol }}"
      value: "{{ beckhoff_verify_write_value | int }}"
      ads_type: byte
      authorized: true
      timeout: "{{ plc_timeout | float }}"
  tasks:
    - name: Safety gate
      ansible.builtin.fail:
        msg: Set allow_beckhoff_write=true for ADS write verification.
      when: not (allow_beckhoff_write | default(false) | bool)

    - name: Read symbol before write
      ansible.builtin.command:
        cmd: python3 "{{ playbook_dir }}/../scripts/plc_cli.py" read --payload-env BECKHOFF_READ
      environment:
        BECKHOFF_READ: "{{ beckhoff_read_payload | to_json }}"
      register: ads_before
      changed_when: false

    - name: Write symbol via pyads ADS
      ansible.builtin.command:
        cmd: python3 "{{ playbook_dir }}/../scripts/plc_cli.py" write --payload-env BECKHOFF_WRITE
      environment:
        BECKHOFF_WRITE: "{{ beckhoff_write_payload | to_json }}"
      register: ads_write
      changed_when: true

    - name: Read symbol after write
      ansible.builtin.command:
        cmd: python3 "{{ playbook_dir }}/../scripts/plc_cli.py" read --payload-env BECKHOFF_READ
      environment:
        BECKHOFF_READ: "{{ beckhoff_read_payload | to_json }}"
      register: ads_after
      changed_when: false

    - name: Parse ADS round-trip results
      ansible.builtin.set_fact:
        ads_before_result: "{{ ads_before.stdout | from_json }}"
        ads_write_result: "{{ ads_write.stdout | from_json }}"
        ads_after_result: "{{ ads_after.stdout | from_json }}"

    - name: Assert ADS write/read round-trip
      ansible.builtin.assert:
        that:
          - ads_write_result.success | bool
          - ads_after_result.success | bool
          - (ads_after_result.result['values'] | first).value == (beckhoff_verify_write_value | int)
        fail_msg: >-
          ADS verify failed for {{ beckhoff_verify_symbol }}.
          before={{ ads_before_result }} write={{ ads_write_result }} after={{ ads_after_result }}

    - name: Show ADS round-trip
      ansible.builtin.debug:
        msg:
          symbol: "{{ beckhoff_verify_symbol }}"
          before: "{{ (ads_before_result.result['values'] | first).value }}"
          written: "{{ beckhoff_verify_write_value }}"
          after: "{{ (ads_after_result.result['values'] | first).value }}"
