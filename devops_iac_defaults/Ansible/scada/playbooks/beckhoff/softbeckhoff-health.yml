---
- name: Beckhoff SoftBeckhoff — TwinCAT symbol catalog health
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Probe SoftBeckhoff symbol catalog (production-like REST surface)
      ansible.builtin.uri:
        url: "http://{{ plc_host }}:{{ beckhoff_rest_port | default(8080) }}/symbols"
        method: GET
        status_code: 200
        timeout: "{{ plc_timeout | int }}"
      register: symbol_catalog_response
      changed_when: false

    - name: Assert expected lab symbols are published
      ansible.builtin.assert:
        that:
          - symbol_catalog_response.json | map(attribute='name') | list | intersect(beckhoff_symbols.split(',') | map('trim') | list) | length > 0
        fail_msg: "SoftBeckhoff /symbols missing configured symbols {{ beckhoff_symbols }}"

    - name: Show symbol catalog
      ansible.builtin.debug:
        msg: "{{ symbol_catalog_response.json }}"
