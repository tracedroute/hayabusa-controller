<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set password · Hayabusa Controller</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0b1220; color: #e2e8f0;
    }
    .card {
      width: min(420px, 92vw); padding: 1.5rem 1.4rem 1.25rem;
      border: 1px solid #1e293b; border-radius: 12px; background: #111827;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 .35rem; font-size: 1.2rem; font-weight: 650; }
    p { margin: 0 0 1rem; color: #94a3b8; font-size: .92rem; line-height: 1.4; }
    label { display: block; margin: .65rem 0 .3rem; font-size: .82rem; color: #cbd5e1; }
    input {
      width: 100%; box-sizing: border-box; padding: .7rem .75rem;
      border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #f8fafc;
    }
    .err {
      margin: 0 0 .85rem; padding: .55rem .7rem; border-radius: 8px;
      background: rgba(185,28,28,.18); color: #fecaca; font-size: .86rem;
    }
    button {
      margin-top: 1rem; width: 100%; padding: .75rem 1rem; border: 0; border-radius: 8px;
      background: #5d93a2; color: #041016; font-weight: 700; cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <form class="card" method="post" action="/auth/set-password" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <h1>Choose your admin password</h1>
    <p>Replace the first-launch bootstrap password before continuing to setup.</p>
    {% if error %}
    <div class="err">{{ error }}</div>
    {% endif %}
    <label for="password">New password</label>
    <input id="password" name="password" type="password" minlength="10" required autocomplete="new-password" />
    <label for="password_confirm">Confirm password</label>
    <input id="password_confirm" name="password_confirm" type="password" minlength="10" required autocomplete="new-password" />
    <button type="submit">Save and continue</button>
  </form>
  <p style="max-width:26rem;margin:1rem auto 0;text-align:center;font-size:0.8rem;color:#8faabe;">
    <a href="/static/THIRD-PARTY-NOTICES.txt" target="_blank" rel="noopener noreferrer" style="color:#38bdf8;">Open source &amp; third-party notices</a>
  </p>
</body>
</html>
